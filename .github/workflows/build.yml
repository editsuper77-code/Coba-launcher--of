name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch submodules (upstream pinned versions)
        run: |
          git clone --depth 1 --branch v3_openjdk --recurse-submodules --shallow-submodules https://github.com/MojoLauncher/MojoLauncher /tmp/up
          rm -rf glfw mojoexec sdl NoBlocklist
          cp -r /tmp/up/glfw /tmp/up/mojoexec /tmp/up/sdl /tmp/up/NoBlocklist .
          find glfw mojoexec sdl NoBlocklist -type f | wc -l
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"
      - run: gradle :app_mojo:assembleFullDebug
      - uses: actions/upload-artifact@v4
        with:
          name: COBA-Launcher-APK
          path: app_mojo/build/outputs/apk/full/debug/*.apk
