name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch native parts (auto-detect right branch)
        run: |
          rm -rf glfw mojoexec sdl NoBlocklist
          fetch_dep() {
            repo=$1; dest=$2; pat=$3
            git clone --filter=blob:none --no-checkout "https://github.com/MojoLauncher/$repo" "$dest"
            cd "$dest"
            found=""
            for ref in $(git for-each-ref --sort=-committerdate --format='%(refname)' refs/remotes/origin | grep -v HEAD); do
              if git grep -q -E "$pat" "$ref" -- jni_bindings; then found=$ref; break; fi
            done
            echo "== $repo -> ${found:-NOT FOUND}"
            if [ -z "$found" ]; then
              git for-each-ref --format='%(refname)' refs/remotes/origin
              found=refs/remotes/origin/HEAD
            fi
            git checkout -q "$found"
            git log -1 --oneline
            cd "$GITHUB_WORKSPACE"
          }
          fetch_dep mojoexec mojoexec 'setUseTurnip'
          fetch_dep MojoSDL sdl 'onNativeMouseButton\([^)]*float'
          git clone --depth 1 https://github.com/MojoLauncher/glfw glfw
          git clone --depth 1 https://github.com/MojoLauncher/NoBlocklist NoBlocklist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"
      - run: gradle :app_mojo:assembleFullDebug
      - uses: actions/upload-artifact@v4
        with:
          name: COBA-Launcher-APK
          path: app_mojo/build/outputs/apk/full/debug/*.apk
